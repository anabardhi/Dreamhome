  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/favicon.png">

  
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">

      <a class="navbar-brand" href="#">DreamHomes</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">

        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link active" href="homepage.html">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="properties.html">Properties</a>
          </li>

          

          

          <li class="nav-item">
            <a class="nav-link" href="about.html">About</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>

        </ul>
      </div>
    </div>
  </nav>

<!-- Header -->
<section class="contact-header">
  <div class="container">
    <h1 class="display-4 fw-bold">Contact Us</h1>
    <p>We would love to hear from you</p>
  </div>
</section>

<!-- Contact Form -->
<section class="py-5">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-lg-8">

        <div class="bg-white p-5 contact-box">

          <form id="contactForm">

            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" id="name" class="form-control" placeholder="Enter your name">
            </div>

            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" id="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
              <label class="form-label">Subject</label>
              <input type="text" id="subject" class="form-control" placeholder="Enter subject">
            </div>

            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="5" id="message" placeholder="Write your message"></textarea>
            </div>

            <button class="btn btn-dark w-100">Send Message</button>

          </form>

        </div>

      </div>
    </div>

  </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">
  <p class="mb-0">© 2026 DreamHomes. All Rights Reserved.</p>
</footer>
<script src="script.js"></script>
</body>
</html>
